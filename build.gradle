plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.0.0'
group = 'com.wra.client'
base { archivesName = 'WRA-Client-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { wraclient { source sourceSets.main } } }
        server { workingDirectory project.file('run-server'); args '--nogui'; mods { wraclient { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
jar {
    manifest { attributes(['Specification-Title':'WRA Client', 'Specification-Vendor':'WRA', 'Specification-Version':'1', 'Implementation-Title':project.name, 'Implementation-Version':project.version, 'Implementation-Vendor':'WRA']) }
    finalizedBy 'reobfJar'
}
